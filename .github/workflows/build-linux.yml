name: Build Linux Binary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
          - platform: linux/arm64
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          docker buildx build --load --platform ${{ matrix.platform }} -t sculpin-build:${{ matrix.arch }} -f Dockerfile .
          docker create --name temp-container sculpin-build:${{ matrix.arch }}
          docker cp temp-container:/app/sculpin-linux-${{ matrix.arch }} .
          docker rm temp-container
          mkdir -p build
          mv sculpin-linux-${{ matrix.arch }} build/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sculpin-bin-linux-${{ matrix.arch }}
          path: build/sculpin-linux-${{ matrix.arch }}
          retention-days: 30
